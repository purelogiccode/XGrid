<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="XGrid documentation: an enhanced xemu core with an Avalonia desktop shell for original Xbox emulation.">
  <meta name="theme-color" content="#0d1117">
  <title>XGrid Documentation</title>
  <link rel="icon" href="assets/xgrid-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="app">Loading XGrid documentation…</div>
  <noscript>
    <p style="max-width: 720px; margin: 2rem auto; font-family: sans-serif; color: #d7e0ea; background: #141a22; padding: 1rem 1.25rem; border-radius: 8px;">
      The interactive documentation needs JavaScript. You can read the same
      content as Markdown in <a href="index.md" style="color: #3daee9;">docs/index.md</a>.
    </p>
  </noscript>

  <script>
    window.$docsify = {
      name: 'XGrid Docs',
      repo: 'https://github.com/purelogiccode/XGrid',
      logo: 'assets/xgrid-mark.svg',
      homepage: 'index.md',
      coverpage: true,
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      relativePath: true,
      notFoundPage: '404.md',
      search: {
        placeholder: 'Search the documentation…',
        noData: 'No results.',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Press Ctrl+C',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      },
      editLink: {
        pattern: 'https://github.com/purelogiccode/XGrid/edit/master/docs/:path',
        text: 'Edit this page on GitHub'
      }
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
</body>
</html>
