version: 2

# Dependabot is NOT part of GitHub Actions and does not consume Actions minutes,
# so it stays active on the GitHub Free plan while CI is disabled
# (.github/workflows/* are manual-only since 2026-10-22 - see docs/ci.md).
# Its pull requests simply arrive without automated checks, and the
# `github-actions` ecosystem updates are inert until the workflows run again.
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns: ["*"]
      development-dependencies:
        dependency-type: "development"
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
