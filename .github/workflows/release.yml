name: Release

# Verify the tree on Windows and Linux, publish self-contained binaries for
# every platform, generate an SBOM, attest build provenance and create the
# GitHub release.
#
# Manual only: enable the tag trigger when releases are ready. The jobs run on
# the organization self-hosted runners; macOS verification is skipped, but the
# publish job cross-publishes osx-x64/osx-arm64 from Linux.
on:
  workflow_dispatch:

# --- Enable this block to release on tags ---
# on:
#   push:
#     tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  CI: "true"

jobs:
  # A tag must pass the same build + test gate as a branch before it ships.
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: [self-hosted, Linux, X64, repofleet-ci]
          - os: windows-latest
            runner: [self-hosted, Windows, X64, repofleet-ci]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore XGrid.sln

      - name: Build
        run: dotnet build XGrid.sln -c Release --no-restore --nologo

      - name: Test
        run: >
          dotnet test XGrid.sln -c Release --no-build --no-restore --nologo
          --logger "trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 30

  # SBOM for the tagged source tree (SPDX JSON).
  sbom:
    name: SBOM
    runs-on: [self-hosted, Linux, X64, repofleet-ci]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-spdx
          upload-artifact: true
          upload-release-assets: false

      - name: Generate native CycloneDX SBOM
        run: python3 .github/scripts/native_sbom.py --output sbom-native.cdx.json

      - name: Scan the native SBOM
        # Report-only: C/C++ attribution needs manual triage before it can
        # block a release. The result is uploaded beside the SBOM.
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source \
            --lockfile sbom-native.cdx.json \
            --format json \
            --output-file osv-native.json

      - name: Upload native SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-native
          path: |
            sbom-native.cdx.json
            osv-native.json
          if-no-files-found: ignore
          retention-days: 90

  # Self-contained CLI + frontend for each release platform.
  publish:
    name: Publish (${{ matrix.rid }})
    needs: verify
    runs-on: [self-hosted, Linux, X64, repofleet-ci]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Publish CLI
        run: >
          dotnet publish src/XGrid.Cli/XGrid.Cli.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -p:Version="${GITHUB_REF_NAME#v}"
          -o "publish/cli/${{ matrix.rid }}"

      - name: Publish frontend
        run: >
          dotnet publish src/XGrid.Frontend.Avalonia/XGrid.Frontend.Avalonia.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -p:Version="${GITHUB_REF_NAME#v}"
          -o "publish/frontend/${{ matrix.rid }}"

      - name: Archive
        run: |
          set -euo pipefail
          mkdir -p dist
          for app in cli frontend; do
            dir="publish/$app/${{ matrix.rid }}"
            find "$dir" -type f \( -name '*.pdb' -o -name '*.xml' \) -delete
            # GPL-2.0: the license text, the project notice and the third-party
            # notices must travel with every binary (docs/release-licensing-review.md).
            cp LICENSE COPYING THIRD_PARTY_NOTICES.md README.md "$dir/"
            notes="docs/release-notes/${GITHUB_REF_NAME}.md"
            if [[ -f "$notes" ]]; then cp "$notes" "$dir/RELEASE-NOTES.md"; fi
            printf '%s\n' "${GITHUB_REF_NAME#v}" > "$dir/VERSION"
            if [[ "${{ matrix.rid }}" == win-* ]]; then
              (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/dist/XGrid-$app-${{ matrix.rid }}.zip" .)
            else
              tar -czf "dist/XGrid-$app-${{ matrix.rid }}.tar.gz" -C "$dir" .
            fi
          done
          cd dist
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" \) -print0 \
            | sort -z | xargs -0 sha256sum > "SHA256SUMS-${{ matrix.rid }}.txt"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: xgrid-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub release
    needs: [publish, sbom]
    runs-on: [self-hosted, Linux, X64, repofleet-ci]
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: xgrid-*
          path: dist
          merge-multiple: true

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-spdx
          path: dist

      - name: Download native SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-native
          path: dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%P\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            notes=()
            if [[ -f "docs/release-notes/$TAG.md" ]]; then
              notes=(--notes-file "docs/release-notes/$TAG.md")
            else
              notes=(--generate-notes)
            fi
            gh release create "$TAG" dist/* \
              --title "XGrid $TAG" \
              "${notes[@]}" \
              --verify-tag
          fi
