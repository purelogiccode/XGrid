name: CI

# Disabled during active development: runs only when triggered manually.
# Windows-only while the project targets Windows first; Linux/mac jobs
# return when release binaries are needed.
on:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CI: "true"

jobs:
  build-test:
    name: Build and test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore XGrid.sln

      - name: Build
        run: dotnet build XGrid.sln -c Release --no-restore

      - name: Test
        run: dotnet test XGrid.sln -c Release --no-build --no-restore

      - name: Format verification
        run: dotnet format XGrid.sln --verify-no-changes --no-restore
