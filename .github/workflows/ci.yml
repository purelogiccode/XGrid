name: CI

# Runs the Linux matrix on the organization LAN runner and Windows on a
# GitHub-hosted runner. Public-repository Windows minutes are free; the
# self-hosted Windows runner is not always online.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
  workflow_dispatch:
  schedule:
    # Nightly full matrix (03:17 UTC) so regressions surface without a push.
    - cron: "17 3 * * *"

# Least privilege by default; jobs opt into the extra scopes they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  CI: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Build + test on every supported OS. GNU/Linux also collects coverage.
  # ---------------------------------------------------------------------------
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: [self-hosted, Linux, X64, repofleet-ci]
          - os: windows-latest
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          # The Windows runner's tar cannot archive the cache (every run ended
          # with a save-failure annotation); its restore is already a minute.
          cache: ${{ matrix.os == 'ubuntu-latest' }}
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore XGrid.sln

      - name: Build (warnings are errors)
        run: dotnet build XGrid.sln -c Release --no-restore --nologo

      - name: Test (coverage)
        if: runner.os == 'Linux'
        run: >
          dotnet test XGrid.sln -c Release --no-build --no-restore --nologo
          --collect:"XPlat Code Coverage"
          --logger "trx"
          --results-directory TestResults
          --blame-hang --blame-hang-timeout 20m

      - name: Install ReportGenerator
        if: runner.os == 'Linux'
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Coverage summary and gate
        if: runner.os == 'Linux'
        run: |
          reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:TextSummary"
          {
            echo "### Code coverage"
            echo ""
            echo '```'
            sed -n '1,16p' coverage-report/Summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/coverage_gate.py coverage-report/Summary.txt 60 50

      - name: Test
        if: runner.os != 'Linux'
        run: >
          dotnet test XGrid.sln -c Release --no-build --no-restore --nologo
          --logger "trx"
          --results-directory TestResults
          --blame-hang --blame-hang-timeout 20m

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Native core: compile the product emulator from the vendored xemu tree.
  # Linux has the full toolchain and SDL3 on the LAN runner; the Windows core
  # is still built locally by scripts/build-native-xemu.ps1 for packaging.
  # ---------------------------------------------------------------------------
  native-core:
    name: Native core (Linux)
    runs-on: [self-hosted, Linux, X64, repofleet-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build xemu core
        run: bash scripts/build-native-xemu.sh -j"$(nproc)"

  # ---------------------------------------------------------------------------
  # Deterministic build: two clean builds must produce identical assemblies.
  # ---------------------------------------------------------------------------
  determinism:
    name: Deterministic build
    runs-on: [self-hosted, Linux, X64, repofleet-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore XGrid.sln

      - name: Build (first pass)
        run: dotnet build XGrid.sln -c Release --no-restore --nologo

      - name: Hash assemblies (first pass)
        run: |
          find src -type f -name '*.dll' -path '*/bin/Release/net11.0/*' -print0 \
            | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/first.txt"

      - name: Clean
        run: dotnet clean XGrid.sln -c Release --nologo

      - name: Build (second pass)
        run: dotnet build XGrid.sln -c Release --no-restore --nologo

      - name: Compare hashes
        run: |
          find src -type f -name '*.dll' -path '*/bin/Release/net11.0/*' -print0 \
            | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/second.txt"
          if ! diff -u "$RUNNER_TEMP/first.txt" "$RUNNER_TEMP/second.txt"; then
            echo "Build is not deterministic: assemblies differ between clean builds." >&2
            exit 1
          fi
          echo "Deterministic build verified ($(wc -l < "$RUNNER_TEMP/first.txt") assemblies)."

  # ---------------------------------------------------------------------------
  # Formatting gate (one OS is enough; `dotnet format` is deterministic).
  # ---------------------------------------------------------------------------
  format:
    name: Format verification
    runs-on: [self-hosted, Linux, X64, repofleet-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore XGrid.sln

      - name: dotnet format --verify-no-changes
        run: dotnet format XGrid.sln --no-restore --verify-no-changes --verbosity minimal

  # ---------------------------------------------------------------------------
  # InspectCode (ReSharper command-line) at WARNING severity. The gate and
  # baseline are authoritative; style warnings are not security findings, so
  # this job keeps the report as an artifact instead of publishing SARIF to the
  # code-scanning page.
  # ---------------------------------------------------------------------------
  inspectcode:
    name: InspectCode (warnings)
    runs-on: [self-hosted, Linux, X64, repofleet-ci]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore XGrid.sln

      - name: Build
        run: dotnet build XGrid.sln -c Release --no-restore --nologo

      - name: Install InspectCode
        run: |
          dotnet tool install --global JetBrains.ReSharper.GlobalTools --version 2026.2.3.1
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Run InspectCode
        run: >
          jb inspectcode XGrid.sln
          --output=inspectcode.sarif
          --format=Sarif
          --severity=WARNING
          --include=**/*.cs
          --no-build
          --no-updates

      - name: Gate on findings
        run: python3 .github/scripts/inspectcode_gate.py inspectcode.sarif

      - name: Upload InspectCode report
        if: always() && hashFiles('inspectcode.sarif') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: inspectcode-sarif
          path: inspectcode.sarif
          retention-days: 3

  # ---------------------------------------------------------------------------
  # NuGet vulnerability audit (official SDK command; no third-party service).
  # ---------------------------------------------------------------------------
  security-audit:
    name: Package audit
    runs-on: [self-hosted, Linux, X64, repofleet-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore XGrid.sln

      - name: Audit vulnerable packages
        run: |
          dotnet list XGrid.sln package --vulnerable --include-transitive --format json > package-audit.json
          python3 .github/scripts/vulnerable_gate.py package-audit.json

      - name: Upload audit report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: package-audit
          path: package-audit.json
          if-no-files-found: ignore
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Packaging is not a CI job: the win-x64 archive carries the emulator core,
  # which is built on the Windows development host (xemu/dist is not tracked).
  # Run scripts/package.ps1 there; release.yml covers tagged releases.
  # ---------------------------------------------------------------------------
