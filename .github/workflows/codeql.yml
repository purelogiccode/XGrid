name: CodeQL

# Public repository: code scanning is free. Analyze the managed shell on every
# push/PR and run a weekly deep scan. The C core is covered by the native core
# build, not by CodeQL's C/C++ autobuild.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly deep scan (Mondays, 04:42 UTC) alongside the nightly CI matrix.
    - cron: "42 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CI: "true"

jobs:
  analyze:
    name: Analyze C#
    runs-on: [self-hosted, Linux, X64, repofleet-ci]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [csharp]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

