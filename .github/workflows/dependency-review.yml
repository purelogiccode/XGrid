name: Dependency review

# Manual only: dependency review requires GitHub Advanced Security on a private
# repository and only makes sense on pull_request events. The main CI runs on
# the self-hosted runners.
on:
  # Manual only (and not useful manually): no pull_request trigger.
  workflow_dispatch:

# --- Enable this block if GitHub Advanced Security becomes available ---
# on:
#   pull_request:
#     branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: [self-hosted, Linux, X64, repofleet-ci]
    timeout-minutes: 10
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
