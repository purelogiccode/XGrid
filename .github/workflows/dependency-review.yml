name: Dependency review

# Public repository: dependency review is free and runs on pull requests.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: [self-hosted, Linux, X64, repofleet-ci]
    timeout-minutes: 10
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
