name: Dependency review

# DISABLED (2026-10-22) with the rest of CI: Actions is unavailable on this
# private repository's GitHub Free account and dependency review additionally
# needs GitHub Advanced Security on a private repo. The action only makes sense
# on a pull_request event - a manual run cannot diff a PR, so leave it unused
# until the trigger below is restored. See docs/ci.md.
on:
  # Manual only (and not useful manually): no pull_request trigger.
  workflow_dispatch:

# --- Restore this block (and remove the placeholder above) to enable the check ---
# on:
#   pull_request:
#     branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
